<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="mcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="mcGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Circle -->
  <rect width="100" height="100" rx="28" fill="#0d1424" />
  <rect width="96" height="96" x="2" y="2" rx="26" fill="none" stroke="url(#mcGrad)" stroke-width="2" opacity="0.4" />
  
  <!-- Outer Orbit Ring -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="url(#mcGrad)" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6" />
  
  <!-- Brain / Controller Stylized Nodes -->
  <g filter="url(#mcGlow)" transform="translate(14, 18) scale(0.72)">
    <path d="M50,15 C35,15 25,25 25,40 C25,48 30,55 35,60 C32,65 30,75 35,80 C40,85 48,82 50,78 C52,82 60,85 65,80 C70,75 68,65 65,60 C70,55 75,48 75,40 C75,25 65,15 50,15 Z" fill="none" stroke="url(#mcGrad)" stroke-width="4" stroke-linejoin="round" />
    <circle cx="40" cy="40" r="4" fill="#00d4ff" />
    <circle cx="60" cy="40" r="4" fill="#8b5cf6" />
    <circle cx="50" cy="55" r="4" fill="#fbbf24" />
    <circle cx="42" cy="68" r="3" fill="#10b981" />
    <circle cx="58" cy="68" r="3" fill="#10b981" />
    <line x1="40" y1="40" x2="50" y2="55" stroke="url(#mcGrad)" stroke-width="2" opacity="0.8" />
    <line x1="60" y1="40" x2="50" y2="55" stroke="url(#mcGrad)" stroke-width="2" opacity="0.8" />
    <line x1="50" y1="55" x2="42" y2="68" stroke="url(#mcGrad)" stroke-width="2" opacity="0.8" />
    <line x1="50" y1="55" x2="58" y2="68" stroke="url(#mcGrad)" stroke-width="2" opacity="0.8" />
  </g>
</svg>
